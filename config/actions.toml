# Custom context menu actions
# These appear in the right-click context menu. An action whose command is
# not installed is left out of the menu.

# Raven's opener starts the terminal chosen in the desktop settings.
[[actions]]
name = "Open in Terminal"
command = "raven-open"
args = ["--terminal", "{directory}"]
icon = "utilities-terminal-symbolic"
show_for = "directories"

[[actions]]
name = "Open in Code"
command = "code"
args = ["{path}"]
icon = "text-editor-symbolic"
show_for = "all"

[[actions]]
name = "Compress..."
command = "file-roller"
args = ["--add", "{paths}"]
icon = "package-x-generic-symbolic"
show_for = "all"
multiple = true

[[actions]]
name = "Extract Here"
command = "file-roller"
args = ["--extract-here", "{path}"]
icon = "package-x-generic-symbolic"
show_for = "archives"
