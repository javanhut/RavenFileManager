# Generated by imlazy migrate from Makefile

[settings]
default = "all"

[variables]
app_id = "com.ravenfilemanager.Raven"
bin_name = "ravenfilemanager"
prefix = "/usr/local"
bindir = "{{prefix}}/bin"
datadir = "{{prefix}}/share"
icondir = "{{datadir}}/icons/hicolor/scalable/apps"
destdir = ""
profile = "release"
cargo_flags = "--release"
target_dir = "target/{{profile}}"
binary = "{{target_dir}}/{{bin_name}}"
update_caches = "if [ -z \"{{destdir}}\" ]; then command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q \"{{datadir}}/applications\" || true; command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -qtf \"{{datadir}}/icons/hicolor\" || true; fi"

[commands]

[commands.all]
dep = ["build"]

[commands.build]
run = ["cargo build {{cargo_flags}}"]

[commands.run]
run = ["{{binary}}"]
dep = ["build"]

[commands.test]
run = ["cargo test --workspace"]

[commands.clean]
run = ["cargo clean"]

[commands.install]
run = [
  "echo \"Installing {{bin_name}} to {{destdir}}{{bindir}}...\"",
  "install -Dm755 {{binary}} \"{{destdir}}{{bindir}}/{{bin_name}}\"",
  "install -Dm644 data/{{app_id}}.desktop \"{{destdir}}{{datadir}}/applications/{{app_id}}.desktop\"",
  "install -Dm644 data/{{app_id}}.metainfo.xml \"{{destdir}}{{datadir}}/metainfo/{{app_id}}.metainfo.xml\"",
  "install -Dm644 data/icons/hicolor/scalable/apps/{{app_id}}.svg \"{{destdir}}{{icondir}}/{{app_id}}.svg\"",
  "install -Dm644 config/default.toml \"{{destdir}}{{datadir}}/{{bin_name}}/config/default.toml\"",
  "install -Dm644 config/keybindings.toml \"{{destdir}}{{datadir}}/{{bin_name}}/config/keybindings.toml\"",
  "install -Dm644 config/actions.toml \"{{destdir}}{{datadir}}/{{bin_name}}/config/actions.toml\"",
  "install -Dm644 data/resources/style.css \"{{destdir}}{{datadir}}/{{bin_name}}/resources/style.css\"",
  "install -Dm644 data/resources/resources.gresource.xml \"{{destdir}}{{datadir}}/{{bin_name}}/resources/resources.gresource.xml\"",
  "# D-Bus activation for org.freedesktop.FileManager1, so a \"show in folder\"",
  "# from another application starts the file manager when none is running.",
  "# Generated rather than shipped: the service file needs an absolute Exec,",
  "# which is only known once PREFIX is.",
  "install -d \"{{destdir}}{{datadir}}/dbus-1/services\"",
  "sed 's|@BINDIR@|{{bindir}}|g' data/org.freedesktop.FileManager1.service.in > \"{{destdir}}{{datadir}}/dbus-1/services/org.freedesktop.FileManager1.service\"",
  "chmod 0644 \"{{destdir}}{{datadir}}/dbus-1/services/org.freedesktop.FileManager1.service\"",
  "{{update_caches}}",
  "echo \"Installation complete.\"",
]
dep = ["build"]

[commands.uninstall]
run = [
  "echo \"Uninstalling {{bin_name}}...\"",
  "rm -f \"{{destdir}}{{bindir}}/{{bin_name}}\"",
  "rm -f \"{{destdir}}{{datadir}}/applications/{{app_id}}.desktop\"",
  "rm -f \"{{destdir}}{{datadir}}/metainfo/{{app_id}}.metainfo.xml\"",
  "rm -f \"{{destdir}}{{icondir}}/{{app_id}}.svg\"",
  "rm -f \"{{destdir}}{{datadir}}/dbus-1/services/org.freedesktop.FileManager1.service\"",
  "rm -rf \"{{destdir}}{{datadir}}/{{bin_name}}\"",
  "{{update_caches}}",
  "echo \"Uninstall complete.\"",
]

# Migration notes:
# - evaluated with PROFILE="release" at migrate time: $(if $(filter release,$(PROFILE)),--release,)
